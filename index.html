<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShipInsure — Email Automation</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/drewshafe/si-rep-hub/main/Rephubfavi.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:linear-gradient(135deg,#4a5fc1 0%,#6b7fd7 55%,#8b5cf6 100%); color:#fff; padding:32px; }
  .card { max-width:520px; width:100%; text-align:center; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18);
          border-radius:22px; padding:44px 36px; box-shadow:0 20px 60px rgba(20,16,40,0.35); backdrop-filter:blur(6px); }
  .logo { height:34px; width:auto; margin-bottom:22px; opacity:0.95; }
  .emoji { font-size:3.4em; line-height:1; margin-bottom:14px; }
  h1 { font-size:2em; font-weight:900; letter-spacing:-0.02em; margin-bottom:8px; }
  .tag { font-size:1.02em; opacity:0.9; line-height:1.55; margin-bottom:22px; }
  .badge { display:inline-flex; align-items:center; gap:8px; font-size:0.82em; font-weight:800; text-transform:uppercase; letter-spacing:0.08em;
           background:rgba(255,255,255,0.18); border:1px solid rgba(255,255,255,0.3); border-radius:30px; padding:9px 18px; }
  .foot { margin-top:26px; font-size:0.8em; opacity:0.7; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="https://raw.githubusercontent.com/drewshafe/si-roi-calculator/main/ShipInsure-Logo_Blue-Wht_Horizontal.png" alt="ShipInsure" onerror="this.style.display='none'">
    <div class="emoji">✉️</div>
    <h1>Email Automation</h1>
    <p class="tag">Design and preview the branded, automated emails ShipInsure sends your customers — order protection confirmations, claim updates, and delivery notifications.</p>
    <span class="badge">🚧 Coming soon</span>
    <div class="foot">ShipInsure · Preview Designer</div>
  </div>
</body>
</html>
